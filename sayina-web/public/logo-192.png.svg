<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Gold square background matching brand colour -->
  <rect width="192" height="192" rx="28" fill="#D4A832"/>

  <!-- Outer thin ring -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="#1a1a1a" stroke-width="2.5" opacity="0.7"/>

  <!-- Feather quill — main body (right side barbs) -->
  <path d="M118,36 C138,44 148,62 144,80 C140,98 128,110 118,120 L110,112 C120,104 130,92 132,76 C134,60 126,48 118,36Z" fill="#1a1a1a"/>
  <!-- Feather quill — left side barbs -->
  <path d="M118,36 C100,40 90,56 90,72 C90,88 98,102 110,112 L114,104 C104,96 98,84 100,70 C102,56 110,44 118,36Z" fill="#1a1a1a" opacity="0.85"/>
  <!-- Quill central shaft -->
  <line x1="118" y1="36" x2="100" y2="148" stroke="#D4A832" stroke-width="2.5"/>
  <!-- Quill tip -->
  <path d="M100,148 L96,160 L104,152 Z" fill="#1a1a1a"/>
  <!-- Underline swirl below quill -->
  <path d="M88,162 Q100,170 112,162" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- "S" lettermark — bold, centred, left of quill -->
  <text
    x="54"
    y="122"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-style="italic"
    font-weight="bold"
    fill="#1a1a1a"
    opacity="0.92"
  >S</text>
</svg>
